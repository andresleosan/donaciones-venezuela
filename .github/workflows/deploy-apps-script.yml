name: Deploy Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      description:
        description: "Descripcion opcional para la version Apps Script"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

env:
  SCRIPT_ID: 1lmeh3SBoa0Jv8NF4DcrQPy6R__VuSig1BgKV0XV9FIjB6fbelFHOuenX
  DEPLOYMENT_ID: AKfycbzIzkckhq_hur34K0JJZqyMG20QXnFXSHqa_CWhYITCMdCY6-e1GbhW99n0POsmtf0Q9g
  CLASP_ROOT_DIR: apps-script
  APPS_SCRIPT_EXEC_URL: https://script.google.com/macros/s/AKfycbzIzkckhq_hur34K0JJZqyMG20QXnFXSHqa_CWhYITCMdCY6-e1GbhW99n0POsmtf0Q9g/exec

jobs:
  deploy:
    name: Push, version and redeploy Apps Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Install CLASP
        run: |
          set -Eeuo pipefail
          npm install --global @google/clasp
          clasp --version

      - name: Prepare scripts
        run: |
          set -Eeuo pipefail
          chmod +x scripts/apps-script-*.sh

      - name: Authenticate CLASP
        env:
          CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
          CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
        run: ./scripts/apps-script-auth.sh

      - name: Verify local and remote Apps Script configuration
        run: ./scripts/apps-script-verify.sh --remote

      - name: Deploy to existing Apps Script deployment
        env:
          WORKFLOW_DESCRIPTION: ${{ github.event.inputs.description || '' }}
        run: |
          set -Eeuo pipefail
          description="$WORKFLOW_DESCRIPTION"
          if [[ -z "$description" ]]; then
            description="GitHub Actions ${GITHUB_REPOSITORY}@${GITHUB_SHA} run ${GITHUB_RUN_NUMBER}"
          fi
          ./scripts/apps-script-deploy.sh --skip-auth --description "$description"

      - name: Confirm endpoint remains unchanged
        run: |
          set -Eeuo pipefail
          expected="https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec"
          if [[ "$APPS_SCRIPT_EXEC_URL" != "$expected" ]]; then
            echo "Configured endpoint does not match deployment ID" >&2
            echo "APPS_SCRIPT_EXEC_URL=$APPS_SCRIPT_EXEC_URL" >&2
            echo "expected=$expected" >&2
            exit 1
          fi
          response_body="$(mktemp)"
          response_headers="$(mktemp)"
          trap 'rm -f "$response_body" "$response_headers"' EXIT
          http_status="$(curl --location --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --dump-header "$response_headers" \
            --output "$response_body" \
            --write-out "%{http_code}" \
            "$APPS_SCRIPT_EXEC_URL")"
          if [[ "$http_status" != "200" ]]; then
            echo "Public /exec endpoint returned HTTP $http_status" >&2
            exit 1
          fi
          content_type="$(awk -F': ' 'tolower($1) == "content-type" {print tolower($2)}' "$response_headers" | tr -d '\r' | tail -n 1)"
          media_type="${content_type%%;*}"
          if [[ "$media_type" != "application/json" ]]; then
            echo "Public /exec endpoint returned Content-Type: $content_type" >&2
            exit 1
          fi
          RESPONSE_BODY="$response_body" node <<'NODE'
          const fs = require('node:fs');
          const body = fs.readFileSync(process.env.RESPONSE_BODY, 'utf8');
          let data;
          try {
            data = JSON.parse(body);
          } catch {
            console.error('Public /exec endpoint did not return valid JSON');
            process.exit(1);
          }
          const required = ['lugares', 'voluntarios', 'rescatistas', 'motorizados', 'estadisticas'];
          const missing = required.filter((key) => !(key in data));
          if (missing.length) {
            console.error(`Public /exec endpoint is missing keys: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE
          echo "Public /exec endpoint healthy: $APPS_SCRIPT_EXEC_URL"
