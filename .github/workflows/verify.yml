name: verify

on:
  pull_request:
  push:
    branches: [main]

# Una sola corrida por rama: una subida nueva cancela la anterior.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Emulator Suite corre sobre la JVM y firebase-tools exige JDK 21 o superior.
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache de los binarios de Emulator Suite
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Instalar dependencias
        run: |
          npm ci
          npm --prefix functions ci

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Pruebas de reglas, contratos y Emulator Suite
        run: npm run test:emulators

      - name: Build del frontend
        run: npm run build

      - name: Paridad de idiomas
        run: python scripts/verificar-idioma.py

      # Informativo: las moderadas transitivas no bloquean, las altas si.
      - name: Auditoría de dependencias
        run: |
          npm audit --audit-level=high
          npm audit --prefix functions --audit-level=high
